plugins {
    id 'net.neoforged.moddev' version '2.0.148'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://maven.caffeinemc.net/releases' } }
        filter { includeGroup 'net.caffeinemc' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}
neoForge {
    version = project.neoforge_version
    validateAccessTransformers = true
    accessTransformers { file('src/main/resources/META-INF/accesstransformer.cfg') }
    runs {
        client {
            client()
            gameDirectory = file('run')
            if (providers.gradleProperty('smokeWorld').isPresent()) {
                programArguments.addAll('--quickPlaySingleplayer', providers.gradleProperty('smokeWorld').get(), '--offlineDeveloperMode')
            }
        }
        server { server(); gameDirectory = file('run-server') }
    }
    mods { voxy { sourceSet(sourceSets.main) } }
    unitTest {
        enable()
        testedMod = mods.voxy
    }
}
// These integrations have no native NeoForge release; omit their Fabric APIs.
sourceSets.main.java {
    exclude 'me/cortex/voxy/client/config/ModMenuIntegration.java'
    exclude 'me/cortex/voxy/client/mixin/flashback/**'
    exclude 'me/cortex/voxy/client/mixin/nvidium/**'
    exclude 'me/cortex/voxy/commonImpl/mixin/chunky/**'
}
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    // Minecraft's library versions must precede transitive standalone libraries.
    runtimeClasspath = output + sourceSets.main.output + sourceSets.main.compileClasspath + sourceSets.main.runtimeClasspath + configurations.testRuntimeClasspath
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.neoforged:testframework:${neoforge_version}"
    implementation "maven.modrinth:sodium:${sodium_version}"
    // Sodium's distribution nests its implementation; expose it to javac only.
    compileOnly 'net.caffeinemc:sodium-neoforge-mod:0.9.2+mc26.2'
    compileOnly "maven.modrinth:lithium:${lithium_version}"
    compileOnly "maven.modrinth:iris:${iris_version}"
    compileOnly "maven.modrinth:vivecraft:${vivecraft_version}"
    if (providers.gradleProperty('withIntegrations').isPresent()) {
        runtimeOnly "maven.modrinth:iris:${iris_version}"
        runtimeOnly "maven.modrinth:lithium:${lithium_version}"
    }
    // Match Minecraft 26.2's LWJGL ABI; bundle only modules absent from vanilla.
    implementation platform("org.lwjgl:lwjgl-bom:${lwjgl_version}")
    ['lwjgl-lmdb', 'lwjgl-zstd'].each { module ->
        jarJar(implementation("org.lwjgl:${module}:${lwjgl_version}")) {
            version { strictly "[${lwjgl_version},3.5)"; prefer project.lwjgl_version }
        }
    }
    jarJar(implementation('org.rocksdb:rocksdbjni:10.2.1'))
    jarJar(implementation('redis.clients:jedis:5.1.0'))
    jarJar(implementation('org.apache.commons:commons-pool2:2.12.0'))
    jarJar(implementation('org.lz4:lz4-java:1.8.0'))
    jarJar(implementation('org.tukaani:xz:1.10'))
    jarJar(implementation('org.xerial:sqlite-jdbc:3.49.1.0'))
}
// Strip native-jar JPMS descriptors; preserve LWJGL platform paths.
configurations { lwjglNativesRaw }
dependencies {
    ['natives-windows', 'natives-linux', 'natives-linux-arm64'].each { classifier ->
        ['lwjgl-lmdb', 'lwjgl-zstd'].each { module ->
            lwjglNativesRaw "org.lwjgl:${module}:${lwjgl_version}:${classifier}"
            runtimeOnly "org.lwjgl:${module}:${lwjgl_version}:${classifier}"
        }
    }
}
def extractedNatives = layout.buildDirectory.dir('extracted-natives')
tasks.register('extractLwjglNatives', Sync) {
    from({ configurations.lwjglNativesRaw.collect { zipTree(it) } }) {
        include '**/*.dll', '**/*.so', '**/*.dylib'
    }
    into extractedNatives
}
tasks.named('jar') {
    dependsOn 'extractLwjglNatives'
    from(extractedNatives)
    from('LICENSE.md')
}
def commit = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
}.standardOutput.asText.map { it.trim() }
processResources {
    def props = [version: project.version, commit: commit.get(),
                 minecraft_version: project.minecraft_version,
                 neoforge_version: project.neoforge_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
    exclude 'fabric.mod.json', 'voxy.accesswidener'
}

tasks.register('validatePort', Exec) {
    dependsOn tasks.named('jar')
    def python = providers.gradleProperty('pythonExecutable').getOrElse(
            System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3')
    commandLine python, 'scripts/validate_port.py', tasks.named('jar').get().archiveFile.get().asFile
}
tasks.register('nativeSmoke', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'me.cortex.voxy.PortSmokeTest'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
tasks.named('check') { dependsOn 'validatePort', 'nativeSmoke' }
[
    configSafety: 'me.cortex.voxy.ConfigSafetyTest',
    dataSafety: 'me.cortex.voxy.common.world.DataSafetyTest',
    sectionFailure: 'me.cortex.voxy.common.world.ActiveSectionFailureTest',
    adaptorSafety: 'me.cortex.voxy.StorageAdaptorSafetyTest',
    importSafety: 'me.cortex.voxy.commonImpl.importers.ImportSafetyTest',
    executorSafety: 'me.cortex.voxy.common.thread.ExecutorFailureTest'
].each { taskName, entrypoint ->
    tasks.register(taskName, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = entrypoint
        jvmArgs '--enable-native-access=ALL-UNNAMED'
    }
    tasks.named('check') { dependsOn taskName }
}
// Mapping tests require Minecraft registries and NeoForge's test loader.
tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
tasks.register('mapperPersistence') { dependsOn tasks.named('test') }
